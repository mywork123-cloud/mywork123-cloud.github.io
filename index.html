<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#FFC83C">
<title>工作台</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png"/>
<style>
:root {
  --primary: #FFC83C; --primary-dark: #F5A623; --primary-light: #FFE08A;
  --accent: #FF8C42; --accent-light: #FFB370;
  --bg: #FFF9F0; --surface: #FFFFFF; --divider: #FFF0D4;
  --text-primary: #4A3C28; --text-secondary: #9C8B6F; --danger: #E6463A;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg); color: var(--text-primary);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
}
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
.header {
  background: #FFC83C; color: white; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 18px; font-weight: 600; }
.menu-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 4px 8px; }
.stat-strip {
  background: #FFC83C; color: white; padding: 0 20px 20px;
  display: flex; justify-content: space-around;
}
.stat-item { text-align: center; }
.stat-item .value { font-size: 22px; font-weight: 700; }
.stat-item .label { font-size: 11px; opacity: 0.85; margin-top: 2px; }
.content { flex: 1; padding: 16px; padding-bottom: 80px; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 12px; }
.section-header h2 { font-size: 16px; font-weight: 700; }
.add-btn { background: none; border: 1px solid var(--primary-dark); color: var(--primary-dark); padding: 4px 12px; border-radius: 16px; font-size: 13px; cursor: pointer; }

.task-card {
  background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
  display: flex; align-items: center; box-shadow: 0 1px 3px rgba(255,200,60,0.1);
}
.task-card .checkbox {
  width: 22px; height: 22px; border: 2px solid var(--primary); border-radius: 6px;
  margin-right: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
}
.task-card .checkbox.checked { background: var(--primary); }
.task-card .checkbox.checked::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; }
.task-card .title { flex: 1; font-size: 15px; }
.task-card.done .title { text-decoration: line-through; color: var(--text-secondary); }
.task-card .delete { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; padding: 4px 8px; opacity: 0.5; }

.card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(255,200,60,0.1); }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.platform-tag { font-size: 11px; padding: 2px 8px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
.platform-tag.douyin { background: #FFE0E0; color: #E6463A; }
.platform-tag.bilibili { background: #E0E8FF; color: #4A6BE6; }
.platform-tag.xhs { background: #FFE0EC; color: #E6468A; }
.hook { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; border-left: 3px solid var(--accent); }
.analysis-box { font-size: 13px; color: var(--text-primary); margin-bottom: 10px; line-height: 1.6; }
.analysis-box .l { color: var(--accent); font-weight: 600; }
.creative-box { background: rgba(255,140,66,0.08); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
.creative-box .l { color: var(--accent); font-weight: 600; display: block; margin-bottom: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tag { background: var(--divider); color: var(--primary-dark); padding: 3px 10px; border-radius: 12px; font-size: 11px; }
.actions { display: flex; gap: 8px; }
.btn { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
.btn.link { background: var(--accent); }
.btn.used { background: var(--divider); color: var(--text-secondary); }

.trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.trend-title { font-weight: 600; font-size: 15px; flex: 1; }
.heat { font-size: 12px; color: var(--accent); font-weight: 600; }
.remake-box { background: rgba(255,140,66,0.08); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
.remake-box .l { color: var(--accent); font-weight: 600; display: block; margin-bottom: 4px; }

.review-title { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.review-metrics { display: flex; justify-content: space-around; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.metric { text-align: center; }
.metric .v { font-size: 14px; font-weight: 700; }
.metric .lbl { font-size: 11px; color: var(--text-secondary); }
.suggestion { background: rgba(255,140,66,0.08); border: 1px solid rgba(255,140,66,0.2); border-radius: 8px; padding: 12px; font-size: 13px; line-height: 1.6; }
.suggestion .l { color: var(--accent); font-weight: 600; font-size: 12px; margin-bottom: 6px; }
.suggestion .si { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,140,66,0.1); }
.suggestion .si:last-child { margin-bottom: 0; border-bottom: none; }
.note-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.note-body { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-date { font-size: 11px; color: var(--text-secondary); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-state .icon { font-size: 56px; opacity: 0.3; margin-bottom: 16px; }
.empty-state p { font-size: 14px; margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; }

.refresh-bar {
  background: var(--surface); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
  display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px rgba(255,200,60,0.1);
}
.refresh-bar .info { font-size: 12px; color: var(--text-secondary); }
.refresh-bar .info b { color: var(--text-primary); }
.refresh-btn { background: var(--accent); color: white; border: none; padding: 6px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
  background: var(--surface); border-top: 1px solid var(--divider);
  display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100;
}
.nav-item { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; cursor: pointer; color: var(--text-secondary); font-size: 10px; }
.nav-item.active { color: var(--primary-dark); }
.nav-item .icon { font-size: 22px; }
.fab {
  position: fixed; bottom: 80px; right: 24px; width: 56px; height: 56px; border-radius: 50%;
  background: #FF8C42; color: white; border: none; font-size: 28px; cursor: pointer;
  box-shadow: 0 4px 12px rgba(255,140,66,0.4); z-index: 90; display: flex; align-items: center; justify-content: center;
}
.drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 200; display: none; }
.drawer-overlay.open { display: block; }
.drawer { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--surface); z-index: 201; transform: translateX(-100%); transition: transform 0.3s; overflow-y: auto; padding-top: env(safe-area-inset-top); }
.drawer.open { transform: translateX(0); }
.drawer-header { background: #FFC83C; color: white; padding: 24px 20px; }
.drawer-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.drawer-header p { font-size: 13px; opacity: 0.85; }
.drawer-item { display: flex; align-items: center; padding: 14px 20px; cursor: pointer; color: var(--text-primary); font-size: 15px; gap: 12px; }
.drawer-item.active { background: rgba(255,200,60,0.15); color: var(--primary-dark); font-weight: 600; }
.drawer-item .icon { font-size: 20px; color: var(--text-secondary); }
.drawer-item.active .icon { color: var(--primary-dark); }
.drawer-divider { height: 1px; background: var(--divider); margin: 8px 0; }
.drawer-date { padding: 16px 20px; font-size: 12px; color: var(--text-secondary); }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; max-height: 85vh; overflow-y: auto; }
.modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal input, .modal textarea, .modal select { width: 100%; padding: 10px 12px; border: 1px solid var(--divider); border-radius: 8px; font-size: 14px; margin-bottom: 10px; font-family: inherit; }
.modal textarea { resize: vertical; min-height: 80px; }
.modal label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; margin-top: 8px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-btn { padding: 8px 20px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
.modal-btn.cancel { background: var(--divider); color: var(--text-primary); }
.modal-btn.confirm { background: var(--primary); color: white; }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(74,60,40,0.9); color: white; padding: 10px 24px; border-radius: 24px; font-size: 14px; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="menu-btn" onclick="toggleDrawer()">☰</button>
    <h1>工作台</h1>
    <div style="width:36px"></div>
  </div>
  <div id="page-container"></div>
  <button class="fab" id="fab" onclick="onFabClick()" style="display:none">+</button>
  <div class="bottom-nav" id="bottom-nav"></div>
</div>
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header"><h2>工作台</h2><p>完成一项打勾，进度一目了然</p></div>
  <div id="drawer-items"></div>
  <div class="drawer-divider"></div>
  <div class="drawer-date" id="drawer-date"></div>
</div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'workbench_v4';
const def = {
  tasks: [
    { id: 't1', title: '运动 30 分钟', done: false },
    { id: 't2', title: '晚上 11:30 提醒睡觉', done: false },
  ],
  ideas: [],
  trends: [],
  reviews: [],
  notes: [],
};
let D = JSON.parse(localStorage.getItem(KEY) || 'null') || JSON.parse(JSON.stringify(def));
if (!D.tasks) D = JSON.parse(JSON.stringify(def));
function save() { localStorage.setItem(KEY, JSON.stringify(D)); }
function gid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,5); }

/* === 选题灵感数据池 === */
const IP = [
  { t: '打工人下班后的自律日常', p: 'douyin', l: 'https://www.douyin.com/search/打工人下班自律',
    h: '每天下班只会躺平刷手机？看看我是怎么用2小时改变人生的',
    a: '火爆核心：精准击中打工人的"时间焦虑"痛点，画面真实不做作，从疲惫到自律的反差感极强，3秒内引发共鸣。',
    c: '口播改编：以"我也曾经下班就瘫在沙发上"开头，用真实经历切入，展示你的下班后时间管理表，结尾抛出"你下班后都在做什么？评论区告诉我"。',
    g: ['自律','职场','口播'] },

    c: '口播改编：用"第1天 vs 第30天"对比开场，讲述学习过程中的3个崩溃瞬间和1个顿悟时刻，结尾给出"普通人也能做到"的行动清单。',
    g: ['成长','记录','激励'] },
  { t: '为什么你总是存不下钱', p: 'bilibili', l: 'https://search.bilibili.com/all?keyword=存不下钱',
    h: '月薪5000到月薪2万，我都存不下钱，问题到底出在哪？',

  { t: '一个人住到底有多爽', p: 'xhs', l: 'https://www.xiaohongshu.com/search_result?keyword=一个人住',
    h: '独居3年，我总结了让生活品质翻倍的10个小习惯',

    c: '口播改编：用"一个人住的快乐，你根本想象不到"开场，讲3个最实用的独居好习惯，结尾"你一个人住最怕什么？我来教你解决"。',
    g: ['独居','生活','干货'] },
  { t: 'AI工具让我工作效率提升10倍', p: 'bilibili', l: 'https://search.bilibili.com/all?keyword=AI工具提升效率',

    g: ['AI','效率','职场'] },
  { t: '那些越早知道越好的人生道理', p: 'douyin', l: 'https://www.douyin.com/search/人生道理',

    c: '口播改编：用"这条视频可能会改变你的轨迹"开场，讲3条最重要的人生道理（用真实经历佐证），结尾"哪条最戳你？评论区聊聊"。',
    g: ['成长','感悟','口播'] },
  { t: '坚持早起100天后我变了', p: 'douyin', l: 'https://www.douyin.com/search/坚持早起100天',

    g: ['安全','独居','干货'] },
];

/* === 爆款热点数据池 === */
const TP = [
  { t: '00后整顿职场系列', ht: '🔥 328.5w播放', h: '老板让我加班，我直接把劳动法甩他脸上',

    l: 'https://www.douyin.com/search/00后整顿职场' },

    l: 'https://www.douyin.com/search/沉浸式回家vlog' },
  { t: '月薪3千和月薪3万的区别', ht: '🔥 198.3w播放', h: '同样是打工，为什么差距这么大？',

  { t: '我花了一年时间搞副业', ht: '🔥 165.7w播放', h: '从0到月入过万，我踩过的坑你别踩',

  { t: '为什么优秀的人都在独处', ht: '🔥 87.3w播放', h: '越合群的人越平庸，这不是鸡汤是科学',
    r: '二创方案：改编为"为什么优秀的创作者都在独处"，保留"反常识"钩子，讲独处对创作的重要性。开头用"我做内容最好的灵感，都是在一个人待着的时候来的"。',
    l: 'https://search.bilibili.com/all?keyword=独处与优秀' },
  { t: '那些让你瞬间破防的瞬间', ht: '🔥 76.9w播放', h: '成年人的崩溃，从一句"你还好吗"开始',
    r: '二创方案：改编为"做自媒体让我破防的瞬间"，保留情感共鸣，讲创作者的真实崩溃时刻。开头用"粉丝留言问我你还好吗，我盯着屏幕哭了"。',
    l: 'https://www.douyin.com/search/瞬间破防' },
];

const pages = [
  { id: 'plan', icon: '✓', label: '每日计划' },
  { id: 'ideas', icon: '💡', label: '选题每日灵感' },
  { id: 'trending', icon: '🔥', label: '爆款热点视频/二创' },
  { id: 'review', icon: '📊', label: '内容复盘' },
  { id: 'notes', icon: '📝', label: '备忘录' },
];
let cur = 'plan';

function renderNav() {
  document.getElementById('bottom-nav').innerHTML = pages.map(p =>
    `<button class="nav-item ${cur===p.id?'active':''}" onclick="go('${p.id}')"><span class="icon">${p.icon}</span><span>${p.label}</span></button>`
  ).join('');
}
function renderDrawer() {
  document.getElementById('drawer-items').innerHTML = pages.map(p =>
    `<div class="drawer-item ${cur===p.id?'active':''}" onclick="go('${p.id}');toggleDrawer()"><span class="icon">${p.icon}</span><span>${p.label}</span></div>`
  ).join('');
  const n = new Date();
  document.getElementById('drawer-date').textContent = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`;
}
function go(id) { cur = id; renderNav(); renderDrawer(); renderPage();
  document.getElementById('fab').style.display = ['review','notes'].includes(id) ? 'flex' : 'none'; }
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawer-overlay').classList.toggle('open');
}

/* ==== 1. 每日计划 ==== */
function renderPlanPage() {
  const total = D.tasks.length, done = D.tasks.filter(t=>t.done).length, pending = total - done, rate = total===0?0:Math.round(done/total*100);
  return `<div class="stat-strip">
    <div class="stat-item"><div class="value">${total}</div><div class="label">今日任务</div></div>
    <div class="stat-item"><div class="value">${done}</div><div class="label">已完成</div></div>
    <div class="stat-item"><div class="value">${pending}</div><div class="label">待完成</div></div>
    <div class="stat-item"><div class="value">${rate}%</div><div class="label">完成率</div></div>
  </div>
  <div class="content">
    <div class="section-header"><h2>今日待办</h2><button class="add-btn" onclick="addTask()">+ 新增任务</button></div>
    ${D.tasks.length===0?'<p style="text-align:center;color:var(--text-secondary);padding:40px 0">暂无任务，点击右上角新增</p>':D.tasks.map(t=>`
      <div class="task-card ${t.done?'done':''}">
        <div class="checkbox ${t.done?'checked':''}" onclick="toggleT('${t.id}')"></div>
        <span class="title">${t.title}</span>
        <button class="delete" onclick="delT('${t.id}')">🗑</button>
      </div>`).join('')}
  </div>`;
}
function toggleT(id) { const t = D.tasks.find(x=>x.id===id); if(t){t.done=!t.done;save();renderPage();} }
function delT(id) { D.tasks = D.tasks.filter(x=>x.id!==id); save(); renderPage(); }
function addTask() {
  showModal(`<h3>新增任务</h3>
    <input type="text" id="ti" placeholder="输入任务名称" autofocus>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeM()">取消</button>
      <button class="modal-btn confirm" onclick="doAddTask()">添加</button>
    </div>`);
}
function doAddTask() {
  const v = document.getElementById('ti').value.trim();
  if(v) { D.tasks.push({ id: gid(), title: v, done: false }); save(); closeM(); renderPage(); }
}

/* ==== 2. 选题每日灵感 ==== */
function renderIdeasPage() {
  const today = new Date().toLocaleDateString('zh-CN');
  const total = D.ideas.length;
  const done = D.ideas.filter(i => i.done).length;
  const rate = total === 0 ? 0 : Math.round(done / total * 100);
  return `<div class="stat-strip">
    <div class="stat-item"><div class="value">${total}</div><div class="label">今日选题</div></div>
    <div class="stat-item"><div class="value">${done}</div><div class="label">已完成</div></div>
    <div class="stat-item"><div class="value">${total - done}</div><div class="label">待完成</div></div>
    <div class="stat-item"><div class="value">${rate}%</div><div class="label">完成率</div></div>
  </div>
  <div class="content">
    <div class="refresh-bar">
      <div class="info">📅 今日推荐 · <b>${today}</b><br>每日21:00更新爆款选题</div>
      <button class="refresh-btn" onclick="refIdeas()">🔄 换一批</button>
    </div>
    <div class="section-header"><h2>选题任务</h2><button class="add-btn" onclick="addIdeaTask()">+ 新增选题</button></div>
    ${D.ideas.length === 0 ? '<p style="text-align:center;color:var(--text-secondary);padding:20px 0">点击"换一批"获取今日选题灵感</p>' : D.ideas.map(i => ideaTaskCard(i)).join('')}
  </div>`;
}
function ideaTaskCard(i) {
  const pn = i.p === 'douyin' ? '抖音' : i.p === 'bilibili' ? 'B站' : '小红书';
  return `<div class="task-card ${i.done ? 'done' : ''}">
    <div class="checkbox ${i.done ? 'checked' : ''}" onclick="toggleIdea('${i.id}')"></div>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">${i.t} <span class="platform-tag ${i.p}" style="font-size:10px;padding:1px 6px">${pn}</span></div>
      <div style="font-size:12px;color:var(--text-secondary)">${i.h}</div>
    </div>
    <button class="delete" onclick="delIdea('${i.id}')">🗑</button>
  </div>`;
}
function addIdeaTask() {
  showModal(`<h3>新增选题任务</h3>
    <input type="text" id="ii" placeholder="输入选题名称" autofocus>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeM()">取消</button>
      <button class="modal-btn confirm" onclick="doAddIdea()">添加</button>
    </div>`);
}
function doAddIdea() {
  const v = document.getElementById('ii').value.trim();
  if(v) { D.ideas.push({ id: gid(), t: v, p: 'douyin', l: '', h: '', a: '', c: '', g: [], done: false }); save(); closeM(); renderPage(); }
}
function toggleIdea(id) {
  const i = D.ideas.find(x => x.id === id);
  if (i) { i.done = !i.done; save(); renderPage(); }
}
function delIdea(id) {
  D.ideas = D.ideas.filter(x => x.id !== id);
  save(); renderPage();
}
function refIdeas() {
  const s = [...IP].sort(() => Math.random() - 0.5).slice(0, 4);
  D.ideas = s.map(x => ({ ...x, id: gid(), done: false }));
  save(); renderPage(); toast('已更新今日选题灵感');
}

/* ==== 3. 爆款热点视频/二创 ==== */
function renderTrendingPage() {
  const today = new Date().toLocaleDateString('zh-CN');
  const total = D.trends.length;
  const done = D.trends.filter(t => t.done).length;
  const rate = total === 0 ? 0 : Math.round(done / total * 100);
  return `<div class="stat-strip">
    <div class="stat-item"><div class="value">${total}</div><div class="label">今日热点</div></div>
    <div class="stat-item"><div class="value">${done}</div><div class="label">已完成</div></div>
    <div class="stat-item"><div class="value">${total - done}</div><div class="label">待完成</div></div>
    <div class="stat-item"><div class="value">${rate}%</div><div class="label">完成率</div></div>
  </div>
  <div class="content">
    <div class="refresh-bar">
      <div class="info">🔥 今日热点 · <b>${today}</b><br>每日9:00更新二创素材</div>
      <button class="refresh-btn" onclick="refTrends()">🔄 换一批</button>
    </div>
    <div class="section-header"><h2>热点任务</h2><button class="add-btn" onclick="addTrendTask()">+ 新增热点</button></div>
    ${D.trends.length === 0 ? '<p style="text-align:center;color:var(--text-secondary);padding:20px 0">点击"换一批"获取今日爆款热点</p>' : D.trends.map(t => trendTaskCard(t)).join('')}
  </div>`;
}
function trendTaskCard(t) {
  return `<div class="task-card ${t.done ? 'done' : ''}">
    <div class="checkbox ${t.done ? 'checked' : ''}" onclick="toggleTrend('${t.id}')"></div>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">${t.t}</div>
      <div style="font-size:12px;color:var(--text-secondary)">${t.h}</div>
    </div>
    <button class="delete" onclick="delTrend('${t.id}')">🗑</button>
  </div>`;
}
function addTrendTask() {
  showModal(`<h3>新增热点任务</h3>
    <input type="text" id="ti2" placeholder="输入热点名称" autofocus>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeM()">取消</button>
      <button class="modal-btn confirm" onclick="doAddTrend()">添加</button>
    </div>`);
}
function doAddTrend() {
  const v = document.getElementById('ti2').value.trim();
  if(v) { D.trends.push({ id: gid(), t: v, ht: '', h: '', r: '', l: '', done: false }); save(); closeM(); renderPage(); }
}
function toggleTrend(id) {
  const t = D.trends.find(x => x.id === id);
  if (t) { t.done = !t.done; save(); renderPage(); }
}
function delTrend(id) {
  D.trends = D.trends.filter(x => x.id !== id);
  save(); renderPage();
}
function refTrends() {
  const s = [...TP].sort(() => Math.random() - 0.5).slice(0, 4);
  D.trends = s.map(x => ({ ...x, id: gid(), done: false }));
  save(); renderPage(); toast('已更新今日爆款热点');
}

/* ==== 4. 内容复盘 ==== */
function renderReviewPage() {
  if(D.reviews.length===0) return `<div class="content"><div class="empty-state"><div class="icon">📊</div><p>暂无复盘记录</p><p class="hint">点击右下角 + 录入第一条复盘</p></div></div>`;
  return `<div class="content">${D.reviews.map(r=>{
    const a = analyze(r);
    return `<div class="card">
      <div class="review-title">${r.t} <span style="font-size:12px;color:var(--text-secondary)">${r.d}</span></div>
      <div class="review-metrics">
        <div class="metric"><div class="v">${r.v}</div><div class="lbl">播放</div></div>
        <div class="metric"><div class="v">${r.lk}</div><div class="lbl">点赞</div></div>
        <div class="metric"><div class="v">${r.cm}</div><div class="lbl">评论</div></div>
        <div class="metric"><div class="v">${r.sh}</div><div class="lbl">转发</div></div>
        <div class="metric"><div class="v">${r.cr}%</div><div class="lbl">完播率</div></div>
      </div>
      ${r.s?`<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">📦 流量来源：${r.s}</div>`:''}
      <div class="suggestion"><div class="l">🤖 AI 分析建议</div>${a.map(s=>`<div class="si">${s}</div>`).join('')}</div>
      ${r.na?`<div style="margin-top:8px;font-size:13px;color:var(--text-secondary)">📌 下次动作：${r.na}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}
function analyze(r) {
  const s = [];
  const lr = r.v>0?r.lk/r.v:0, cr = r.v>0?r.cm/r.v:0, sr = r.v>0?r.sh/r.v:0;
  if(r.cr<30) s.push('⚠️ 完播率偏低（<30%）：建议优化前3秒前置钩子，设置悬念或冲突点，缩短视频到30秒以内');
  else if(r.cr<50) s.push('📊 完播率中等（30-50%）：前3秒可以但中段流失多，精简冗余内容，增加节奏变化');
  else s.push('✅ 完播率优秀（≥50%）：内容节奏把控好，继续保持');
  if(lr<0.03) s.push('⚠️ 点赞率偏低（<3%）：内容价值感不够，增加干货密度或情感共鸣点，口播时加强语气节奏');
  else if(lr<0.05) s.push('📊 点赞率中等（3-5%）：可增加"值得收藏"的干货总结段落');
  else s.push('✅ 点赞率优秀（≥5%）：内容认可度高');
  if(cr<0.005) s.push('⚠️ 评论率偏低（<0.5%）：视频结尾抛出互动问题引导留言，如"你同意吗？评论区聊聊"');
  else if(cr<0.01) s.push('📊 评论率中等（0.5-1%）：增加争议性观点或开放式结尾激发讨论');
  else s.push('✅ 评论率优秀（≥1%）：互动引导做得好');
  if(sr<0.005) s.push('⚠️ 转发率偏低（<0.5%）：内容分享价值不够，增加"有用/有趣/有共鸣"元素，口播加入"转发给需要的人"');
  else s.push('✅ 转发率优秀：内容有传播力');
  return s;
}
function addReviewModal() {
  showModal(`<h3>录入复盘数据</h3>
    <label>作品标题</label><input type="text" id="rt" placeholder="例：打工人下班后自律日常">
    <label>数据指标</label>
    <div style="display:flex;gap:8px"><input type="number" id="rv" placeholder="播放量" value="0"><input type="number" id="rl" placeholder="点赞数" value="0"></div>
    <div style="display:flex;gap:8px"><input type="number" id="rc" placeholder="评论数" value="0"><input type="number" id="rs" placeholder="转发数" value="0"></div>
    <input type="number" id="rr" placeholder="完播率 (%)" value="0">
    <label>流量来源</label><select id="rso"><option value="推荐页">推荐页</option><option value="关注页">关注页</option><option value="搜索">搜索</option><option value="个人主页">个人主页</option><option value="其他">其他</option></select>
    <label>下次改进动作（选填）</label><input type="text" id="rn" placeholder="例：优化前3秒钩子">
    <div class="modal-actions"><button class="modal-btn cancel" onclick="closeM()">取消</button><button class="modal-btn confirm" onclick="doAddReview()">保存复盘</button></div>`);
}
function doAddReview() {
  const t = document.getElementById('rt').value.trim() || '未命名复盘';
  D.reviews.unshift({
    id: gid(), t,
    v: parseInt(document.getElementById('rv').value)||0,
    lk: parseInt(document.getElementById('rl').value)||0,
    cm: parseInt(document.getElementById('rc').value)||0,
    sh: parseInt(document.getElementById('rs').value)||0,
    cr: parseFloat(document.getElementById('rr').value)||0,
    s: document.getElementById('rso').value,
    na: document.getElementById('rn').value.trim(),
    d: new Date().toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'})
  });
  save(); closeM(); renderPage(); toast('复盘已保存，历史记录永久存档');
}

/* ==== 5. 备忘录 ==== */
function renderNotesPage() {
  if(D.notes.length===0) return `<div class="content"><div class="empty-state"><div class="icon">📝</div><p>暂无笔记</p><p class="hint">点击右下角 + 添加第一条笔记</p></div></div>`;
  return `<div class="content">${D.notes.map(n=>`
    <div class="card"><div class="note-title">${n.t}</div><div class="note-body">${n.b}</div><div class="note-date">${n.d}</div></div>`).join('')}</div>`;
}
function addNoteModal() {
  showModal(`<h3>新增笔记</h3>
    <input type="text" id="nt" placeholder="标题" autofocus>
    <textarea id="nb" placeholder="内容"></textarea>
    <div class="modal-actions"><button class="modal-btn cancel" onclick="closeM()">取消</button><button class="modal-btn confirm" onclick="doAddNote()">添加</button></div>`);
}
function doAddNote() {
  const t = document.getElementById('nt').value.trim();
  if(t) { D.notes.unshift({ id: gid(), t, b: document.getElementById('nb').value.trim(), d: new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) }); save(); closeM(); renderPage(); }
}
function onFabClick() {
  if(cur==='review') addReviewModal();
  else if(cur==='notes') addNoteModal();
}
function renderPage() {
  const c = document.getElementById('page-container');
  switch(cur) {
    case 'plan': c.innerHTML = renderPlanPage(); break;
    case 'ideas': c.innerHTML = renderIdeasPage(); break;
    case 'trending': c.innerHTML = renderTrendingPage(); break;
    case 'review': c.innerHTML = renderReviewPage(); break;
    case 'notes': c.innerHTML = renderNotesPage(); break;
  }
}
function showModal(h) { document.getElementById('modal-content').innerHTML = h; document.getElementById('modal-overlay').classList.add('open'); }
function closeM() { document.getElementById('modal-overlay').classList.remove('open'); }
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

renderNav(); renderDrawer(); renderPage();
document.getElementById('fab').style.display = 'none';
</script>
</body>
</html>
