<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#FFC83C">
<title>工作台</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png"/>
<style>
:root {
  --primary: #FFC83C;
  --primary-light: #FFE08A;
  --primary-dark: #F5A623;
  --accent: #FF8C42;
  --accent-light: #FFB370;
  --bg: #FFF9F0;
  --surface: #FFFFFF;
  --divider: #FFF0D4;
  --text-primary: #4A3C28;
  --text-secondary: #9C8B6F;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
.app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

/* 顶部导航 */
.header {
  background: #FFC83C;
  color: white;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 18px; font-weight: 600; }
.menu-btn { background: none; border: none; color: white; font-size: 22px; cursor: pointer; padding: 4px 8px; }

/* 统计条 */
.stat-strip {
  background: #FFC83C;
  color: white;
  padding: 0 20px 20px;
  display: flex;
  justify-content: space-around;
}
.stat-item { text-align: center; }
.stat-item .value { font-size: 22px; font-weight: 700; }
.stat-item .label { font-size: 11px; opacity: 0.85; margin-top: 2px; }

/* 内容区 */
.content { flex: 1; padding: 16px; padding-bottom: 80px; }

/* 区块标题 */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 20px 0 12px;
}
.section-header h2 { font-size: 16px; font-weight: 700; }
.add-btn {
  background: none;
  border: 1px solid var(--primary-dark);
  color: var(--primary-dark);
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 13px;
  cursor: pointer;
}
.add-btn.creation { border-color: var(--accent); color: var(--accent); }

/* 任务卡片 */
.task-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  box-shadow: 0 1px 3px rgba(255, 200, 60, 0.1);
}
.task-card .checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid var(--primary);
  border-radius: 6px;
  margin-right: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.task-card .checkbox.checked { background: var(--primary); }
.task-card .checkbox.checked::after { content: '✓'; color: white; font-size: 14px; font-weight: bold; }
.task-card .title { flex: 1; font-size: 15px; }
.task-card.done .title { text-decoration: line-through; color: var(--text-secondary); }
.task-card .delete {
  background: none;
  border: none;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  opacity: 0.5;
}

/* 灵感卡片 */
.idea-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(255, 200, 60, 0.1);
}
.idea-card .idea-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.idea-card .hook {
  background: var(--bg);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  border-left: 3px solid var(--accent);
}
.idea-card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  background: var(--divider);
  color: var(--primary-dark);
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
}
.idea-card .actions { display: flex; gap: 8px; margin-top: 10px; }
.idea-card .action-btn {
  background: var(--primary);
  color: white;
  border: none;
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

/* 爆款列表 */
.trend-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: flex-start;
  box-shadow: 0 1px 3px rgba(255, 200, 60, 0.1);
}
.trend-rank {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: white;
  margin-right: 12px;
  flex-shrink: 0;
}
.trend-rank.top { background: var(--accent); }
.trend-rank.normal { background: var(--divider); color: var(--text-secondary); }
.trend-content { flex: 1; }
.trend-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.trend-hook { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
.trend-heat { font-size: 12px; color: var(--accent); font-weight: 600; }

/* 复盘卡片 */
.review-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(255, 200, 60, 0.1);
}
.review-title { font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.review-metrics { display: flex; justify-content: space-around; margin-bottom: 12px; }
.metric { text-align: center; }
.metric .val { font-size: 14px; font-weight: 700; }
.metric .lbl { font-size: 11px; color: var(--text-secondary); }
.review-suggestion {
  background: rgba(255, 140, 66, 0.08);
  border: 1px solid rgba(255, 140, 66, 0.2);
  border-radius: 8px;
  padding: 12px;
  font-size: 13px;
}
.review-suggestion .label { color: var(--accent); font-weight: 600; font-size: 12px; margin-bottom: 4px; }

/* 笔记卡片 */
.note-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: 0 1px 3px rgba(255, 200, 60, 0.1);
}
.note-title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
.note-body { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-date { font-size: 11px; color: var(--text-secondary); }

/* 空状态 */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-state .icon { font-size: 56px; opacity: 0.3; margin-bottom: 16px; }
.empty-state p { font-size: 14px; margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; }

/* 底部导航 */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 480px;
  margin: 0 auto;
  background: var(--surface);
  border-top: 1px solid var(--divider);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
.nav-item {
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 12px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 10px;
}
.nav-item.active { color: var(--primary-dark); }
.nav-item .icon { font-size: 22px; }

/* 浮动按钮 */
.fab {
  position: fixed;
  bottom: 80px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #FF8C42;
  color: white;
  border: none;
  font-size: 28px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(255, 140, 66, 0.4);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 抽屉 */
.drawer-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  display: none;
}
.drawer-overlay.open { display: block; }
.drawer {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 280px;
  background: var(--surface);
  z-index: 201;
  transform: translateX(-100%);
  transition: transform 0.3s;
  overflow-y: auto;
  padding-top: env(safe-area-inset-top);
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  background: #FFC83C;
  color: white;
  padding: 24px 20px;
}
.drawer-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.drawer-header p { font-size: 13px; opacity: 0.85; }
.drawer-item {
  display: flex;
  align-items: center;
  padding: 14px 20px;
  cursor: pointer;
  color: var(--text-primary);
  font-size: 15px;
  gap: 12px;
}
.drawer-item.active { background: rgba(255, 200, 60, 0.15); color: var(--primary-dark); font-weight: 600; }
.drawer-item .icon { font-size: 20px; color: var(--text-secondary); }
.drawer-item.active .icon { color: var(--primary-dark); }
.drawer-divider { height: 1px; background: var(--divider); margin: 8px 0; }
.drawer-date { padding: 16px 20px; font-size: 12px; color: var(--text-secondary); }

/* 弹窗 */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 360px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal input, .modal textarea, .modal select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--divider);
  border-radius: 8px;
  font-size: 14px;
  margin-bottom: 10px;
  font-family: inherit;
}
.modal textarea { resize: vertical; min-height: 80px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-btn {
  padding: 8px 20px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
  cursor: pointer;
}
.modal-btn.cancel { background: var(--divider); color: var(--text-primary); }
.modal-btn.confirm { background: var(--primary); color: white; }
.modal-btn.confirm.accent { background: var(--accent); }

/* Toast */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(74, 60, 40, 0.9);
  color: white;
  padding: 10px 24px;
  border-radius: 24px;
  font-size: 14px;
  z-index: 400;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

.page { display: none; }
.page.active { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <button class="menu-btn" onclick="toggleDrawer()">☰</button>
    <h1>工作台</h1>
    <div style="width:36px"></div>
  </div>
  <div id="page-container"></div>
  <button class="fab" id="fab" onclick="onFabClick()" style="display:none">+</button>
  <div class="bottom-nav" id="bottom-nav"></div>
</div>
<div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>工作台</h2>
    <p>完成一项打勾，进度一目了然</p>
  </div>
  <div id="drawer-items"></div>
  <div class="drawer-divider"></div>
  <div class="drawer-date" id="drawer-date"></div>
</div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_KEY = 'creator_workbench_data';
const defaultData = {
  tasks: [
    { id: 't1', title: '普拉提 1 小时', done: false, category: 'routine' },
    { id: 't2', title: '每日健身 1 小时', done: false, category: 'routine' },
    { id: 't3', title: '英语学习 1 小时', done: false, category: 'routine' },
    { id: 't4', title: '看书', done: false, category: 'routine' },
    { id: 't5', title: '写复盘', done: false, category: 'routine' },
    { id: 't6', title: '9 点收灵感', done: false, category: 'creation' },
    { id: 't7', title: '刷对标账号', done: false, category: 'creation' },
    { id: 't8', title: '发完即复盘', done: false, category: 'creation' },
  ],
  ideas: [
    { id: 'i1', title: '如何用 AI 做专属工作台', hook: '只会空想，行动力为0？恭喜你，你的时代来了！', source: '抖音', tags: ['AI', '效率'] },
    { id: 'i2', title: '创作者日更的底层逻辑', hook: '为什么你发了100条视频还没火？', source: '原创', tags: ['创作', '方法论'] },
    { id: 'i3', title: '爆款视频拆解：前3秒钩子', hook: '99%的人不知道，爆款视频的秘密在前3秒', source: '小红书', tags: ['爆款', '钩子'] },
  ],
  reviews: [],
  notes: [],
};
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || defaultData;
if (!data.tasks) data = JSON.parse(JSON.stringify(defaultData));
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function genId() { return Date.now().toString() + Math.random().toString(36).substr(2, 5); }

const pages = [
  { id: 'plan', icon: '✓', label: '每日计划' },
  { id: 'ideas', icon: '💡', label: '选题灵感' },
  { id: 'trending', icon: '🔥', label: '爆款钩子' },
  { id: 'review', icon: '📊', label: '内容复盘' },
  { id: 'notes', icon: '📝', label: '备忘录' },
];
let currentPage = 'plan';

function renderBottomNav() {
  document.getElementById('bottom-nav').innerHTML = pages.map(p => `
    <button class="nav-item ${currentPage === p.id ? 'active' : ''}" onclick="switchPage('${p.id}')">
      <span class="icon">${p.icon}</span><span>${p.label}</span>
    </button>`).join('');
}
function renderDrawer() {
  document.getElementById('drawer-items').innerHTML = pages.map(p => `
    <div class="drawer-item ${currentPage === p.id ? 'active' : ''}" onclick="switchPage('${p.id}'); toggleDrawer()">
      <span class="icon">${p.icon}</span><span>${p.label}</span>
    </div>`).join('') + `
    <div class="drawer-divider"></div>
    <div class="drawer-item" onclick="showToast('每日健身任务已在每日计划中')"><span class="icon">💪</span><span>每日健身</span></div>
    <div class="drawer-item" onclick="showToast('英语学习任务已在每日计划中')"><span class="icon">🌐</span><span>英语学习</span></div>`;
  const now = new Date();
  document.getElementById('drawer-date').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
}
function switchPage(pageId) {
  currentPage = pageId;
  renderBottomNav(); renderDrawer(); renderPage();
  document.getElementById('fab').style.display = ['ideas', 'review', 'notes'].includes(pageId) ? 'flex' : 'none';
}
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawer-overlay').classList.toggle('open');
}
function renderPage() {
  const c = document.getElementById('page-container');
  switch (currentPage) {
    case 'plan': c.innerHTML = renderPlanPage(); break;
    case 'ideas': c.innerHTML = renderIdeasPage(); break;
    case 'trending': c.innerHTML = renderTrendingPage(); break;
    case 'review': c.innerHTML = renderReviewPage(); break;
    case 'notes': c.innerHTML = renderNotesPage(); break;
  }
}
function renderPlanPage() {
  const total = data.tasks.length;
  const done = data.tasks.filter(t => t.done).length;
  const pending = total - done;
  const rate = total === 0 ? 0 : Math.round(done / total * 100);
  const routines = data.tasks.filter(t => t.category === 'routine');
  const creations = data.tasks.filter(t => t.category === 'creation');
  return `
    <div class="stat-strip">
      <div class="stat-item"><div class="value">${total}</div><div class="label">今日任务</div></div>
      <div class="stat-item"><div class="value">${done}</div><div class="label">已完成</div></div>
      <div class="stat-item"><div class="value">${pending}</div><div class="label">待完成</div></div>
      <div class="stat-item"><div class="value">${rate}%</div><div class="label">完成率</div></div>
    </div>
    <div class="content">
      <div class="section-header"><h2>个人日常</h2><button class="add-btn" onclick="showAddTaskModal('routine')">+ 新增</button></div>
      ${routines.map(t => taskCard(t)).join('')}
      <div class="section-header"><h2>创作任务</h2><button class="add-btn creation" onclick="showAddTaskModal('creation')">+ 新增</button></div>
      ${creations.map(t => taskCard(t)).join('')}
    </div>`;
}
function taskCard(t) {
  return `<div class="task-card ${t.done ? 'done' : ''}">
    <div class="checkbox ${t.done ? 'checked' : ''}" onclick="toggleTask('${t.id}')"></div>
    <span class="title">${t.title}</span>
    <button class="delete" onclick="deleteTask('${t.id}')">🗑</button></div>`;
}
function renderIdeasPage() {
  if (data.ideas.length === 0) return emptyState('💡', '暂无灵感', '点击右下角 + 添加第一条灵感');
  return `<div class="content">${data.ideas.map(i => `
    <div class="idea-card">
      <div class="idea-title">${i.title} ${i.used ? '<span style="font-size:11px;color:#F5A623;background:rgba(255,200,60,0.15);padding:2px 8px;border-radius:8px">已用</span>' : ''}</div>
      <div class="hook">${i.hook}</div>
      <div class="tags"><span class="tag">${i.source}</span>${i.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="actions"><button class="action-btn" onclick="useIdea('${i.id}')">✓ 转为任务</button></div>
    </div>`).join('')}</div>`;
}
function renderTrendingPage() {
  const trends = [
    { title: 'AI 工作台教程', heat: '🔥 128.5w', hook: '只会空想行动力为0？AI时代来了！' },
    { title: '创作者日更方法论', heat: '🔥 89.2w', hook: '为什么发了100条还没火？' },
    { title: '前3秒钩子公式', heat: '🔥 76.8w', hook: '99%的人不知道爆款秘密' },
    { title: '短视频选题库搭建', heat: '🔥 65.1w', hook: '一个方法解决选题焦虑' },
    { title: '内容复盘模板', heat: '🔥 54.3w', hook: '发完视频必做的3件事' },
  ];
  return `<div class="content">${trends.map((t, i) => `
    <div class="trend-card">
      <div class="trend-rank ${i < 3 ? 'top' : 'normal'}">${i+1}</div>
      <div class="trend-content"><div class="trend-title">${t.title}</div><div class="trend-hook">${t.hook}</div><div class="trend-heat">${t.heat}</div></div>
      <button class="action-btn" onclick="saveTrendToIdeas('${t.title}','${t.hook}')">+ 存</button>
    </div>`).join('')}</div>`;
}
function renderReviewPage() {
  if (data.reviews.length === 0) return emptyState('📊', '暂无复盘记录', '点击右下角 + 添加第一条复盘');
  return `<div class="content">${data.reviews.map(r => {
    const rate = (r.completionRate * 100).toFixed(1);
    let suggestion = '数据表现良好，继续保持！';
    if (r.completionRate < 0.3) suggestion = '完播率偏低，建议前3秒加钩子或缩短视频长度';
    else if (r.likes / (r.views + 1) < 0.05) suggestion = '点赞率偏低，建议增加互动引导';
    else if (r.comments / (r.views + 1) < 0.01) suggestion = '评论率偏低，建议结尾抛问题';
    return `<div class="review-card">
      <div class="review-title">${r.title} <span style="font-size:12px;color:var(--text-secondary)">${r.date}</span></div>
      <div class="review-metrics">
        <div class="metric"><div class="val">${r.views}</div><div class="lbl">播放</div></div>
        <div class="metric"><div class="val">${r.likes}</div><div class="lbl">点赞</div></div>
        <div class="metric"><div class="val">${r.comments}</div><div class="lbl">评论</div></div>
        <div class="metric"><div class="val">${r.shares}</div><div class="lbl">转发</div></div>
        <div class="metric"><div class="val">${rate}%</div><div class="lbl">完播率</div></div>
      </div>
      <div class="review-suggestion"><div class="label">AI 建议</div>${suggestion}</div>
      ${r.nextAction ? `<div style="margin-top:8px;font-size:13px;color:var(--text-secondary)">下次动作：${r.nextAction}</div>` : ''}
    </div>`;
  }).join('')}</div>`;
}
function renderNotesPage() {
  if (data.notes.length === 0) return emptyState('📝', '暂无笔记', '点击右下角 + 添加第一条笔记');
  return `<div class="content">${data.notes.map(n => `
    <div class="note-card"><div class="note-title">${n.title}</div><div class="note-body">${n.body}</div><div class="note-date">${n.date}</div></div>`).join('')}</div>`;
}
function emptyState(icon, title, hint) {
  return `<div class="content"><div class="empty-state"><div class="icon">${icon}</div><p>${title}</p><p class="hint">${hint}</p></div></div>`;
}
function toggleTask(id) { const t = data.tasks.find(x => x.id === id); if (t) { t.done = !t.done; save(); renderPage(); } }
function deleteTask(id) { data.tasks = data.tasks.filter(t => t.id !== id); save(); renderPage(); }
function showAddTaskModal(category) {
  showModal(`<h3>${category === 'routine' ? '新增个人日常' : '新增创作任务'}</h3>
    <input type="text" id="task-input" placeholder="输入任务名称" autofocus>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn confirm ${category === 'creation' ? 'accent' : ''}" onclick="addTask('${category}')">添加</button>
    </div>`);
}
function addTask(category) {
  const input = document.getElementById('task-input');
  if (input.value.trim()) { data.tasks.push({ id: genId(), title: input.value.trim(), done: false, category }); save(); closeModal(); renderPage(); }
}
function useIdea(id) { const idea = data.ideas.find(i => i.id === id); if (idea) { idea.used = true; data.tasks.push({ id: genId(), title: idea.title, done: false, category: 'creation' }); save(); renderPage(); showToast('已转为创作任务'); } }
function saveTrendToIdeas(title, hook) { data.ideas.push({ id: genId(), title, hook, source: '抖音', tags: ['爆款'] }); save(); showToast('已存入灵感库'); }
function onFabClick() { switch (currentPage) { case 'ideas': showAddIdeaModal(); break; case 'review': showAddReviewModal(); break; case 'notes': showAddNoteModal(); break; } }
function showAddIdeaModal() {
  showModal(`<h3>新增灵感</h3>
    <input type="text" id="idea-title" placeholder="标题">
    <input type="text" id="idea-hook" placeholder="钩子（前3秒）">
    <input type="text" id="idea-tags" placeholder="标签（逗号分隔）">
    <select id="idea-source"><option value="原创">原创</option><option value="抖音">抖音</option><option value="小红书">小红书</option><option value="B站">B站</option></select>
    <div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn confirm" onclick="addIdea()">添加</button></div>`);
}
function addIdea() {
  const title = document.getElementById('idea-title').value.trim();
  if (title) { data.ideas.push({ id: genId(), title, hook: document.getElementById('idea-hook').value.trim(), source: document.getElementById('idea-source').value, tags: document.getElementById('idea-tags').value.split(',').map(s => s.trim()).filter(s => s) }); save(); closeModal(); renderPage(); }
}
function showAddReviewModal() {
  showModal(`<h3>新增复盘</h3>
    <input type="text" id="r-title" placeholder="标题">
    <div style="display:flex;gap:8px"><input type="number" id="r-views" placeholder="播放" value="0"><input type="number" id="r-likes" placeholder="点赞" value="0"></div>
    <div style="display:flex;gap:8px"><input type="number" id="r-comments" placeholder="评论" value="0"><input type="number" id="r-shares" placeholder="转发" value="0"></div>
    <input type="number" id="r-rate" placeholder="完播率 (%)" value="0">
    <input type="text" id="r-next" placeholder="下次动作">
    <div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn confirm" onclick="addReview()">添加</button></div>`);
}
function addReview() {
  const title = document.getElementById('r-title').value.trim() || '未命名复盘';
  data.reviews.unshift({ id: genId(), title, views: parseInt(document.getElementById('r-views').value) || 0, likes: parseInt(document.getElementById('r-likes').value) || 0, comments: parseInt(document.getElementById('r-comments').value) || 0, shares: parseInt(document.getElementById('r-shares').value) || 0, completionRate: (parseFloat(document.getElementById('r-rate').value) || 0) / 100, nextAction: document.getElementById('r-next').value.trim(), date: new Date().toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' }) });
  save(); closeModal(); renderPage();
}
function showAddNoteModal() {
  showModal(`<h3>新增笔记</h3>
    <input type="text" id="n-title" placeholder="标题">
    <textarea id="n-body" placeholder="内容"></textarea>
    <div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal()">取消</button><button class="modal-btn confirm" onclick="addNote()">添加</button></div>`);
}
function addNote() {
  const title = document.getElementById('n-title').value.trim();
  if (title) { data.notes.unshift({ id: genId(), title, body: document.getElementById('n-body').value.trim(), date: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) }); save(); closeModal(); renderPage(); }
}
function showModal(html) { document.getElementById('modal-content').innerHTML = html; document.getElementById('modal-overlay').classList.add('open'); }
function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
renderBottomNav(); renderDrawer(); renderPage();
document.getElementById('fab').style.display = 'none';
</script>
</body>
</html>
